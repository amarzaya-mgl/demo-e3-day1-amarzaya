<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Визний орчуулгын захиалга – onlinevisa.mn</title>
<meta name="description" content="Визний баримт бичгийн орчуулгын захиалга өгөх">
<style>
  :root {
    --bg: #FFFFFF;
    --green: #1E8E3E;        /* Буцах товчны өнгө */
    --green-hover: #E8F5EC;
    --lime: #2FAE1F;         /* сайтын --lime (01/ЗӨВЛӨГӨӨ, VISA VISION VICTORY) */
    --text: #1A2230;
    --muted: #5A6675;
    --line: #E3E8EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Дээд хэсэг: зөвхөн сайтын нэр */
  header { border-bottom: 1px solid var(--line); }
  .bar {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site {
    margin-left: auto;
    color: var(--lime);
    font-weight: 500;
    font-size: .75rem;
    letter-spacing: .04em;
    text-decoration: none;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 24px;
  }
  h1 {
    font-size: 1.75rem;
    line-height: 1.25;
    margin: 8px 0 4px;
    color: var(--text);
  }
  .lead { color: var(--muted); margin: 0 0 16px; }
  iframe { display: block; border: 0; width: 100%; }

  /* Доод хэсэг: Буцах + VISA VISION VICTORY */
  footer { border-top: 1px solid var(--line); }
  .foot {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--green);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    padding: 8px 12px 8px 8px;
    border-radius: 6px;
  }
  .back:hover { background: var(--green-hover); }
  .back:focus-visible { outline: 3px solid rgba(30,142,62,.35); outline-offset: 2px; }
  .back svg { width: 22px; height: 22px; }
  .slogan {
    /* "амжилт" шиг: налуу serif бичиг */
    color: #6FA931;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: .75rem;   /* onlinevisa.mn-тэй ижил */
    line-height: 1.2;
    text-decoration: none;
  }
</style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="back" href="/" aria-label="Нүүр хуудас руу буцах">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Буцах
      </a>
      <a class="site" href="/">onlinevisa.mn</a>
    </div>
  </header>

  <main>
    <h1>Визний орчуулгын захиалга</h1>
    <p class="lead">Мэдээллээ бөглөж, баримтаа оруулаад илгээнэ үү. Илгээсний дараа төлбөрийн хуудас нээгдэнэ.</p>

    <!-- Tally маягт (yPWaPx). Гарчгийг дээр харуулсан тул маягтын гарчгийг нуусан. -->
    <iframe
      data-tally-src="https://tally.so/embed/yPWaPx?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy"
      width="100%"
      height="900"
      title="Визний орчуулгын захиалга"></iframe>
  </main>

  <footer>
    <div class="foot">
      <a class="back" href="/" aria-label="Нүүр хуудас руу буцах">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Буцах
      </a>
      <a class="slogan" href="/">visa vision victory</a>
    </div>
  </footer>

  <script>
    // Tally-ийн албан ёсны embed скрипт: маягтын өндрийг автоматаар тааруулна
    var d = document, w = "https://tally.so/widgets/embed.js",
        v = function () {
          if (typeof Tally !== "undefined") { Tally.loadEmbeds(); }
          else {
            d.querySelectorAll("iframe[data-tally-src]:not([src])")
             .forEach(function (e) { e.src = e.dataset.tallySrc; });
          }
        };
    if (typeof Tally !== "undefined") v();
    else if (d.querySelector('script[src="' + w + '"]') == null) {
      var s = d.createElement("script");
      s.src = w; s.onload = v; s.onerror = v;
      d.body.appendChild(s);
    }
  </script>
</body>
</html>
